<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bip — the robot that takes you literally</title>
<style>
  /* The page is drawn like the game: the same ink outline, the same rounded
     shapes, and a solid offset shadow under everything instead of a soft
     blur. Cartoons have no blurry edges, and a crisp page next to a crisp
     canvas reads as one picture rather than a drawing pasted into a form. */
  :root {
    --ink: #2f2a3f;
    --muted: #77708a;
    --line: #2f2a3f;
    --accent: #f2543d;
    --accent-dark: #c33a24;
    --panel: #fffdf7;
    --sun: #f8c62f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: #ffe9c9;
    /* Two dot layers: the same wallpaper the robot's room has. */
    background-image:
      radial-gradient(circle at 12px 12px, rgba(255,255,255,.7) 4px, transparent 5px),
      radial-gradient(circle at 42px 42px, rgba(255,255,255,.45) 3px, transparent 4px);
    background-size: 60px 60px, 60px 60px;
    color: var(--ink);
    font: 16px/1.5 "Segoe UI Rounded", "SF Pro Rounded", "Nunito",
          "Segoe UI", system-ui, -apple-system, sans-serif;
  }

  .wrap { max-width: 1280px; margin: 0 auto; padding: 22px; display: grid;
          grid-template-columns: minmax(0, 1fr) 340px; gap: 22px; align-items: start; }

  canvas { width: 100%; display: block; border-radius: 26px;
           border: 5px solid var(--ink); box-shadow: 0 8px 0 rgba(47,42,63,.22);
           background: #dff0f7; }

  .stage { position: relative; }

  /* A big microphone button: the child presses it themselves and cannot read
     yet, so the whole thing is one large target with an obvious state. The
     white ring keeps it readable over any part of the drawing behind it. */
  .mic {
    position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 12px;
    border: 4px solid var(--ink); border-radius: 999px; cursor: pointer;
    padding: 13px 30px; font: inherit; font-size: 19px; font-weight: 800;
    background: var(--accent); color: #fff;
    outline: 5px solid rgba(255,255,255,.9);
    box-shadow: 0 5px 0 var(--accent-dark);
    transition: transform .08s, box-shadow .08s;
  }
  .mic:active { transform: translateX(-50%) translateY(4px); box-shadow: 0 1px 0 var(--accent-dark); }
  .mic.on { background: #4cbf6d; box-shadow: 0 5px 0 #2d8748; }
  .mic.on:active { box-shadow: 0 1px 0 #2d8748; }
  .mic .dot { width: 13px; height: 13px; border-radius: 50%; background: #fff; }
  .mic.on .dot { animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }

  .panel { background: var(--panel); border: 4px solid var(--ink);
           border-radius: 22px; padding: 18px; box-shadow: 0 6px 0 rgba(47,42,63,.22); }
  .panel + .panel { margin-top: 18px; }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
              color: var(--muted); margin: 0 0 10px; }

  .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .langs { display: flex; gap: 5px; }
  .langs button {
    border: 3px solid var(--ink); background: #fff; color: var(--ink);
    border-radius: 999px; padding: 3px 11px; font: inherit; font-size: 12px;
    font-weight: 700; text-transform: uppercase; cursor: pointer;
  }
  .langs button.on { background: var(--sun); }

  /* Six dots for six levels. A parent can see the whole road at a glance,
     and a child who cannot read still sees that something is filling up. */
  .dots { display: flex; gap: 7px; margin: 12px 0 4px; }
  .dots i { width: 13px; height: 13px; border-radius: 50%;
            border: 3px solid var(--ink); background: #fff; }
  .dots i.done { background: #4cbf6d; }
  .dots i.now { background: var(--sun); transform: scale(1.25); }

  .lvl-name { font-size: 25px; font-weight: 800; line-height: 1.2; margin: 10px 0 8px;
              letter-spacing: -.01em; }
  .lvl-learn { display: inline-block; font-size: 12px; font-weight: 800;
               padding: 3px 12px; border-radius: 999px; background: var(--sun);
               border: 3px solid var(--ink); color: var(--ink); margin-bottom: 12px;
               text-transform: lowercase; }
  .lvl-task { margin: 0; color: #4a4459; font-size: 15px; line-height: 1.55; }

  .row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  button.b { border: 3px solid var(--ink); background: #fff; color: var(--ink);
             border-radius: 14px; padding: 9px 16px; font: inherit; font-weight: 700;
             cursor: pointer; box-shadow: 0 4px 0 rgba(47,42,63,.22);
             transition: transform .08s, box-shadow .08s; }
  button.b:hover { background: #fff6e2; }
  button.b:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(47,42,63,.22); }
  button.b[disabled] { opacity: .35; cursor: default; box-shadow: none; transform: none; }
  button.b.go { background: #4cbf6d; color: #fff; box-shadow: 0 4px 0 #2d8748; }
  button.b.go:hover { background: #5ccb7c; }
  button.b.go:active { box-shadow: 0 1px 0 #2d8748; }
  button.b.key { background: var(--sun); box-shadow: 0 4px 0 #c58f0d; }
  button.b.key:hover { background: #ffd75a; }
  button.b.key:active { box-shadow: 0 1px 0 #c58f0d; }

  /* Typing commands is for the grown-up, not the child: a way to check the
     rules when there is no microphone, or when saying it all out loud during
     debugging has worn thin. */
  .say { display: flex; gap: 10px; margin-top: 12px; }
  .say input { flex: 1; min-width: 0; font: inherit; font-size: 15px; padding: 11px 14px;
               border: 3px solid var(--ink); border-radius: 14px; background: #fff;
               box-shadow: inset 0 3px 0 rgba(47,42,63,.07); }
  .say input::placeholder { color: #a49db4; }
  .say input:focus { outline: 3px solid var(--sun); outline-offset: 2px; }

  /* The log is a conversation, so it is drawn as one: what the child said and
     what Bip answered, in speech bubbles that lean to opposite sides. */
  .log { max-height: 260px; overflow: auto; margin: 0; padding: 2px; list-style: none;
         font-size: 14px; display: flex; flex-direction: column; gap: 10px; }
  .log li { border: 3px solid var(--ink); border-radius: 16px 16px 16px 5px;
            padding: 8px 12px; background: #e9f4ff; max-width: 92%; }
  .log li.bip { align-self: flex-end; border-radius: 16px 16px 5px 16px; background: #e8f8ed; }
  .log .who { color: var(--muted); font-size: 11px; font-weight: 700;
              text-transform: uppercase; letter-spacing: .05em; }
  .log .said { color: var(--ink); }
  .log li.bip .said { color: #216b39; font-weight: 600; }
  .log .got { color: var(--muted); font-size: 12px; font-style: italic; margin-top: 2px; }

  /* Grown-up settings. Deliberately the last panel and visually quieter than
     the game: nothing here is meant to catch a child's eye. */
  .settings label { display: block; font-size: 13px; color: var(--muted);
                    font-weight: 700; margin-bottom: 7px; }
  /* The select gets a line of its own: voice names are long ("Microsoft
     Pavel - Russian (Russia)") and a truncated one tells the parent nothing
     about what they are choosing. */
  .voice-row { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
  .voice-row select { width: 100%; min-width: 0; font: inherit; font-size: 14px;
                      padding: 9px 11px; border: 3px solid var(--ink);
                      border-radius: 14px; background: #fff; color: var(--ink);
                      cursor: pointer; }
  .voice-row select:focus { outline: 3px solid var(--sun); outline-offset: 2px; }
  .hint { margin: 9px 0 0; font-size: 12.5px; color: var(--muted); line-height: 1.5; }

  .warn { background: #fff3f0; border: 3px solid #e8917f; color: #8d3a2a;
          border-radius: 16px; padding: 12px; font-size: 14px; margin-bottom: 14px; }
  .warn[hidden] { display: none; }

  @media (max-width: 980px) {
    .wrap { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="stage">
    <canvas id="cv"></canvas>
    <button class="mic" id="mic"><span class="dot"></span><span id="micText"></span></button>
  </div>

  <div>
    <div class="warn" id="warn" hidden></div>

    <div class="panel">
      <div class="head">
        <h2 style="margin:0"><span id="taskLabel"></span> <span id="lvlNum"></span></h2>
        <div class="langs" id="langs"></div>
      </div>
      <div class="dots" id="dots"></div>
      <p class="lvl-name" id="lvlName"></p>
      <span class="lvl-learn" id="lvlLearn"></span>
      <p class="lvl-task" id="lvlTask"></p>
      <div class="row">
        <button class="b" id="again"></button>
        <button class="b go" id="next"></button>
      </div>
      <div class="say">
        <input id="text" autocomplete="off">
        <button class="b key" id="send"></button>
      </div>
    </div>

    <div class="panel">
      <h2 id="logTitle"></h2>
      <ul class="log" id="log"></ul>
    </div>

    <div class="panel settings">
      <h2 id="setTitle"></h2>
      <label for="voice" id="voiceLabel"></label>
      <div class="voice-row">
        <select id="voice"></select>
        <button class="b" id="voiceTry"></button>
      </div>
      <p class="hint" id="voiceHint"></p>
    </div>
  </div>
</div>

<script src="assets/dict.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/match.js"></script>
<script src="assets/parser.js"></script>
<script src="assets/speech.js"></script>
<script src="assets/scene.js"></script>
<script src="assets/levels.js"></script>
<script src="assets/game.js"></script>
<script>
(function () {
  'use strict';

  var cv = document.getElementById('cv');
  var logEl = document.getElementById('log');
  var micBtn = document.getElementById('mic');
  var micText = document.getElementById('micText');
  var warn = document.getElementById('warn');
  var listening = false;

  function log(who, said, got, cls) {
    var li = document.createElement('li');
    if (cls) li.className = cls;
    li.innerHTML = '<div class="who"></div><div class="said"></div><div class="got"></div>';
    li.children[0].textContent = who;
    li.children[1].textContent = said;
    if (got) li.children[2].textContent = got; else li.children[2].remove();
    // Oldest first, newest at the bottom, scrolled into view — a conversation
    // reads top to bottom. It was the other way round while this was a log of
    // events rather than a dialogue drawn in speech bubbles.
    logEl.appendChild(li);
    while (logEl.children.length > 40) logEl.removeChild(logEl.firstChild);
    logEl.scrollTop = logEl.scrollHeight;
  }

  // ── language ──────────────────────────────────────────────────────────
  // Switching the language changes what the robot hears, what it says and
  // what is written on the buttons, so everything is redrawn and the level is
  // reloaded — its texts come from the language pack too.
  function applyLang() {
    document.documentElement.lang = Lang.get();
    document.title = Lang.t('title');

    micText.textContent = listening ? Lang.t('ui.listening') : Lang.t('ui.speak');
    document.getElementById('taskLabel').textContent = Lang.t('ui.task');
    document.getElementById('again').textContent = Lang.t('ui.again');
    document.getElementById('next').textContent = Lang.t('ui.next');
    document.getElementById('send').textContent = Lang.t('ui.send');
    document.getElementById('text').placeholder = Lang.t('ui.typeHere');
    document.getElementById('logTitle').textContent = Lang.t('ui.logTitle');
    document.getElementById('setTitle').textContent = Lang.t('ui.settings');
    document.getElementById('voiceLabel').textContent = Lang.t('ui.voice');
    document.getElementById('voiceTry').textContent = Lang.t('ui.voiceTry');

    drawLangs();
    fillVoices();
  }

  // ── the robot's voice ─────────────────────────────────────────────────
  // Which system voice reads the lines is a real choice, not a preference:
  // voices differ enormously, and a child who dislikes the one they get stops
  // talking to the robot. The list holds only voices for the current language,
  // so it is refilled whenever the language changes — and again when the
  // browser finally reports its voices, which Chrome does late.
  function fillVoices() {
    var sel = document.getElementById('voice');
    var hint = document.getElementById('voiceHint');
    var list = Speech.voices();
    var current = Speech.voiceName();

    sel.innerHTML = '';
    if (!list.length) {
      hint.textContent = Lang.t('ui.voiceNone');
      sel.disabled = true;
      document.getElementById('voiceTry').disabled = true;
      return;
    }

    sel.disabled = false;
    document.getElementById('voiceTry').disabled = false;
    hint.textContent = Lang.t('ui.voiceAuto');

    list.forEach(function (v) {
      var o = document.createElement('option');
      o.value = v.name;
      o.textContent = v.name;
      if (v.name === current) o.selected = true;
      sel.appendChild(o);
    });
  }

  function drawLangs() {
    var box = document.getElementById('langs');
    box.innerHTML = '';
    Lang.list.forEach(function (code) {
      var b = document.createElement('button');
      b.textContent = code;
      if (code === Lang.get()) b.className = 'on';
      b.addEventListener('click', function () {
        if (code === Lang.get()) return;
        Lang.set(code);
        Speech.relang();
        applyLang();
        Game.again(cv);
      });
      box.appendChild(b);
    });
  }

  function drawDots(now, total) {
    var box = document.getElementById('dots');
    box.innerHTML = '';
    for (var i = 0; i < total; i++) {
      var d = document.createElement('i');
      d.className = i < now ? 'done' : (i === now ? 'now' : '');
      box.appendChild(d);
    }
  }

  Game.init({
    onHeard: function (phrase, understood) {
      log(Lang.t('ui.child'), phrase, Lang.t('ui.understood') + ' ' + understood);
    },
    onSay: function (text) { log('Bip', text, '', 'bip'); },
    onLevel: function (texts, i, total) {
      document.getElementById('lvlNum').textContent = (i + 1) + ' ' + Lang.t('ui.of') + ' ' + total;
      document.getElementById('lvlName').textContent = texts.name || '';
      document.getElementById('lvlLearn').textContent = Lang.t('ui.learning') + ' ' + (texts.learn || '');
      document.getElementById('lvlTask').textContent = texts.task || '';
      document.getElementById('next').disabled = (i + 1 >= total);
      drawDots(i, total);
      logEl.innerHTML = '';
    },
    onWin: function () { log('—', Lang.t('ui.complete'), ''); }
  });

  applyLang();
  Game.load(cv, 0);

  // ── microphone ────────────────────────────────────────────────────────
  if (!Speech.supported()) {
    warn.hidden = false;
    warn.textContent = Lang.t('ui.noSpeech');
    micBtn.disabled = true;
  } else if (location.protocol === 'file:') {
    warn.hidden = false;
    warn.textContent = Lang.t('ui.fileMode');
  }

  Speech.onPhrase(function (text) { Game.handle(text); });

  Speech.onState(function (state, text) {
    if (state === 'error') {
      warn.hidden = false;
      warn.textContent = Lang.t('ui.micError') + ' (' + text + ')';
    }
    if (state === 'hearing' && text) micText.textContent = text.slice(0, 24);
    if (state === 'listening') micText.textContent = Lang.t('ui.listening');
  });

  micBtn.addEventListener('click', function () {
    listening = !listening;
    micBtn.classList.toggle('on', listening);
    if (listening) { Speech.start(); micText.textContent = Lang.t('ui.listening'); }
    else { Speech.stop(); micText.textContent = Lang.t('ui.speak'); }
  });

  // ── typed input ───────────────────────────────────────────────────────
  var textEl = document.getElementById('text');
  function send() {
    var v = textEl.value.trim();
    if (!v) return;
    textEl.value = '';
    Game.handle(v);
  }
  document.getElementById('send').addEventListener('click', send);
  textEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') send(); });

  document.getElementById('again').addEventListener('click', function () { Game.again(cv); });
  document.getElementById('next').addEventListener('click', function () { Game.next(cv); });

  // ── voice picker ──────────────────────────────────────────────────────
  document.getElementById('voice').addEventListener('change', function () {
    Speech.setVoice(this.value);
    document.getElementById('voiceHint').textContent = '';
    Speech.say(Lang.t('ui.voiceHi'));
  });
  document.getElementById('voiceTry').addEventListener('click', function () {
    Speech.say(Lang.t('ui.voiceHi'));
  });
  // Chrome reports its voices well after the page has loaded.
  Speech.onVoices(fillVoices);
})();
</script>
</body>
</html>
